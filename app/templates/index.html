{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <h2>Home</h2>

        {% for post in posts %}
            <div class="post" id="post-{{ post.id }}">
                <p>{{ post.content }}</p>

                <div class="actions">
                    <!-- Like button and like count -->
                    <button class="like-btn" data-post-id="{{ post.id }}">
                        <i class="fa {% if current_user.is_liking(post) %} fa-heart {% else %} fa-heart-o {% endif %}"></i>
                    </button>
                    <span id="like-count-{{ post.id }}">{{ post.like_count() }}</span> likes

                    <!-- Comment button and comment count -->
                    <button class="comment-btn" data-post-id="{{ post.id }}">Comment</button>
                    <span id="comment-count-{{ post.id }}">{{ post.comment_count() }}</span> comments

                    <!-- View comments link -->
                    <a href="{{ url_for('view_post', post_id=post.id) }}">View Comments</a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}

{% block scripts %}
    <!-- Include JavaScript files for handling likes, comments, and saves -->
    <script src="{{ url_for('static', filename='js/like.js') }}"></script>
    <script src="{{ url_for('static', filename='js/comment.js') }}"></script>
    <script src="{{ url_for('static', filename='js/save.js') }}"></script>
{% endblock %}

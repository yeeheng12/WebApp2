{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <h2>Create Post</h2>
        <form method="POST" action="{{ url_for('create_post') }}">
            {{ form.hidden_tag() }}
            <div class="form-group">
                {{ form.content.label }}
                {{ form.content(class="form-control", placeholder="What's on your mind?") }}
            </div>
            <button type="submit" class="btn btn-primary">Create Post</button>
        </form>
    </div>
{% endblock %}
